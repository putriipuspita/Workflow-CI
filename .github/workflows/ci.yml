name: MLflow CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  train:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          pip install mlflow==2.19.0 scikit-learn pandas dagshub

      - name: Run MLflow Project
        env:
          DAGSHUB_USER_TOKEN: ${{ secrets.DAGSHUB_TOKEN }}
          MLFLOW_TRACKING_URI: https://dagshub.com/putriipuspita/eksperimen-sml.mlflow
          MLFLOW_TRACKING_USERNAME: putriipuspita
          MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_TOKEN }}
        run: |
          cd MLProject
          mlflow run . --env-manager=local --experiment-name="random-forest-basic"

            - name: Login Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build Docker Image from MLflow
        run: |
          pip install mlflow
          mlflow models build-docker -m runs:/. /model -n churn-model

      - name: Push Docker Image
        run: |
          docker tag churn-model ${{ secrets.DOCKER_USERNAME }}/mlflow-churn:latest
          docker push ${{ secrets.DOCKER_USERNAME }}/mlflow-churn:latest